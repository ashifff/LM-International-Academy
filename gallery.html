<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - LM International Academy</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="container">
            <h1>LM International Academy</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="course-grid.html">Courses</a></li>
                    <li><a href="gallery.html">Gallery</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="hero" style="background: linear-gradient(rgba(140, 44, 63, 0.8), rgba(140, 44, 63, 0.8)); padding: 60px 20px;">
        <h2>Our Gallery</h2>
        <p>A glimpse into life at LM International Academy.</p>
    </section>

    <section style="max-width: 1200px; margin: 60px auto; padding: 0 20px;">
        <div class="cards" style="grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;">
            
            <div class="card" style="padding: 0; overflow: hidden;">
                <img src="campus.jpg" alt="Our Campus" style="width: 100%; height: 200px; object-fit: cover;">
                <div style="padding: 15px;">
                    <h4 style="color: #8C2C3F;">Main Campus</h4>
                </div>
            </div>

            <div class="card" style="padding: 0; overflow: hidden;">
                <img src="classroom.jpg" alt="Classroom" style="width: 100%; height: 200px; object-fit: cover;">
                <div style="padding: 15px;">
                    <h4 style="color: #8C2C3F;">Modern Classrooms</h4>
                </div>
            </div>

            <div class="card" style="padding: 0; overflow: hidden;">
                <img src="library.jpg" alt="Library" style="width: 100%; height: 200px; object-fit: cover;">
                <div style="padding: 15px;">
                    <h4 style="color: #8C2C3F;">The Library</h4>
                </div>
            </div>

            <div class="card" style="padding: 0; overflow: hidden;">
                <img src="sports.jpg" alt="Sports" style="width: 100%; height: 200px; object-fit: cover;">
                <div style="padding: 15px;">
                    <h4 style="color: #8C2C3F;">Sports Activities</h4>
                </div>
            </div>

        </div>
    </section>

    <footer>
        <p>&copy; 2026 LM International Academy. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
